<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Match Statistics</h2>
    <div class="d-flex gap-2">
      <button
        class="btn btn-success"
        data-bs-toggle="modal"
        data-bs-target="#addStatModal"
      >
        Add Statistic
      </button>
      <div id="adminControls" style="display: none">
        <button class="btn btn-primary" onclick="loadMatchStatistics()">
          Refresh Statistics
        </button>
      </div>
    </div>
  </div>

  <!-- Statistics Overview -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Top Scorers</h5>
          <div class="table-responsive">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>Goals</th>
                </tr>
              </thead>
              <tbody id="topScorersTable">
                <!-- Top scorers will be loaded here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Most Assists</h5>
          <div class="table-responsive">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>Assists</th>
                </tr>
              </thead>
              <tbody id="topAssistsTable">
                <!-- Top assists will be loaded here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Discipline</h5>
          <div class="table-responsive">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>YC</th>
                  <th>RC</th>
                </tr>
              </thead>
              <tbody id="disciplineTable">
                <!-- Discipline stats will be loaded here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Match Statistics Table -->
  <div class="table-responsive">
    <table class="table table-striped table-hover statistics-table">
      <thead class="table-dark">
        <tr>
          <th>Match</th>
          <th>Player</th>
          <th>Event</th>
          <th>Minute</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Statistics will be loaded here dynamically -->
      </tbody>
    </table>
  </div>
</div>

<!-- Add Statistic Modal -->
<div
  class="modal fade"
  id="addStatModal"
  tabindex="-1"
  aria-labelledby="addStatModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addStatModalLabel">Add Match Statistic</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="addStatForm" novalidate>
          <div class="mb-3">
            <label for="statMatchSelect" class="form-label">Match *</label>
            <select
              class="form-select"
              id="statMatchSelect"
              name="match_id"
              required
            >
              <option value="">Select Match</option>
            </select>
            <div class="invalid-feedback">Please select a match.</div>
          </div>
          <div class="mb-3">
            <label for="statPlayerSelect" class="form-label">Player *</label>
            <select
              class="form-select"
              id="statPlayerSelect"
              name="player_id"
              required
            >
              <option value="">Select Player</option>
            </select>
            <div class="invalid-feedback">Please select a player.</div>
          </div>
          <div class="mb-3">
            <label for="eventType" class="form-label">Event Type *</label>
            <select
              class="form-select"
              id="eventType"
              name="event_type"
              required
            >
              <option value="">Select Event</option>
              <option value="goal">Goal</option>
              <option value="assist">Assist</option>
              <option value="yellow_card">Yellow Card</option>
              <option value="red_card">Red Card</option>
              <option value="substitution">Substitution</option>
            </select>
            <div class="invalid-feedback">Please select an event type.</div>
          </div>
          <div class="mb-3">
            <label for="minute" class="form-label">Minute *</label>
            <input
              type="number"
              class="form-control"
              id="minute"
              name="minute"
              min="1"
              max="120"
              required
            />
            <div class="invalid-feedback">
              Please enter a minute between 1 and 120.
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="submit" form="addStatForm" class="btn btn-success">
          Add Statistic
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  // Show admin controls if user is admin
  if (AuthService && AuthService.isAdmin()) {
    const adminControls = document.getElementById("adminControls");
    if (adminControls) {
      adminControls.style.display = "block";
    }
  }

  // Remove old loading and use MVC controller instead
  // The StatisticsController will handle all initialization
</script>
