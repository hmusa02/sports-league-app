<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sports League</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/register.css" />
    <link rel="stylesheet" href="css/teams.css" />
    <link rel="stylesheet" href="css/matches.css" />
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#" onclick="showPage('home')"
          >Sports League</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto" id="navItems">
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="showPage('home')">Home</a>
            </li>
            <li class="nav-item" id="loginNav">
              <a class="nav-link" href="#" onclick="showPage('login')">Login</a>
            </li>
            <li class="nav-item" id="registerNav">
              <a class="nav-link" href="#" onclick="showPage('register')"
                >Register</a
              >
            </li>
            <li class="nav-item" id="teamsNav" style="display: none">
              <a class="nav-link" href="#" onclick="showPage('teams')">Teams</a>
            </li>
            <li class="nav-item" id="matchesNav" style="display: none">
              <a class="nav-link" href="#" onclick="showPage('matches')"
                >Matches</a
              >
            </li>
            <li class="nav-item" id="statisticsNav" style="display: none">
              <a class="nav-link" href="#" onclick="showPage('statistics')"
                >Statistics</a
              >
            </li>
            <li class="nav-item" id="profileNav" style="display: none">
              <a class="nav-link" href="#" onclick="showPage('profile')"
                >Profile</a
              >
            </li>
            <li class="nav-item" id="logoutNav" style="display: none">
              <a class="nav-link" href="#" onclick="logout()">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-4 flex-fill">
      <div id="content">
        <!-- Content will be loaded here -->
      </div>
    </div>

    <footer class="bg-success text-white text-center py-3 mt-auto w-100">
      <small>© 2025 Sports League</small>
    </footer>

    <!-- Modals -->
    <!-- Add Team Modal -->
    <div class="modal fade" id="addTeamModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add New Team</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addTeamForm">
              <div class="mb-3">
                <label for="teamName" class="form-label">Team Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="teamName"
                  name="team_name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="teamCity" class="form-label">City</label>
                <input
                  type="text"
                  class="form-control"
                  id="teamCity"
                  name="city"
                />
              </div>
              <div class="mb-3">
                <label for="coachName" class="form-label">Coach Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="coachName"
                  name="coach_name"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-success" onclick="addTeam()">
              Add Team
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Match Modal -->
    <div class="modal fade" id="addMatchModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add New Match</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addMatchForm">
              <div class="mb-3">
                <label for="homeTeamSelect" class="form-label">Home Team</label>
                <select
                  class="form-select"
                  id="homeTeamSelect"
                  name="home_team_id"
                  required
                >
                  <option value="">Select Home Team</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="awayTeamSelect" class="form-label">Away Team</label>
                <select
                  class="form-select"
                  id="awayTeamSelect"
                  name="away_team_id"
                  required
                >
                  <option value="">Select Away Team</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="matchDate" class="form-label">Match Date</label>
                <input
                  type="datetime-local"
                  class="form-control"
                  id="matchDate"
                  name="date_played"
                />
              </div>
              <div class="mb-3">
                <label for="homeScore" class="form-label"
                  >Home Score (optional)</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="homeScore"
                  name="score_home"
                  min="0"
                />
              </div>
              <div class="mb-3">
                <label for="awayScore" class="form-label"
                  >Away Score (optional)</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="awayScore"
                  name="score_away"
                  min="0"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-success" onclick="addMatch()">
              Add Match
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Player Modal -->
    <div class="modal fade" id="addPlayerModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add New Player</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addPlayerForm">
              <div class="mb-3">
                <label for="playerFirstName" class="form-label"
                  >First Name</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="playerFirstName"
                  name="first_name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="playerLastName" class="form-label">Last Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="playerLastName"
                  name="last_name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="playerPosition" class="form-label">Position</label>
                <select
                  class="form-select"
                  id="playerPosition"
                  name="position"
                  required
                >
                  <option value="">Select Position</option>
                  <option value="Goalkeeper">Goalkeeper</option>
                  <option value="Defender">Defender</option>
                  <option value="Midfielder">Midfielder</option>
                  <option value="Forward">Forward</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="playerTeamSelect" class="form-label">Team</label>
                <select
                  class="form-select"
                  id="playerTeamSelect"
                  name="team_id"
                  required
                >
                  <option value="">Select Team</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-success" onclick="addPlayer()">
              Add Player
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Statistics Modal -->
    <div class="modal fade" id="addStatModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Match Statistics</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addStatForm">
              <div class="mb-3">
                <label for="statMatchSelect" class="form-label">Match</label>
                <select
                  class="form-select"
                  id="statMatchSelect"
                  name="match_id"
                  required
                >
                  <option value="">Select Match</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="statPlayerSelect" class="form-label">Player</label>
                <select
                  class="form-select"
                  id="statPlayerSelect"
                  name="player_id"
                  required
                >
                  <option value="">Select Player</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="eventType" class="form-label">Event Type</label>
                <select
                  class="form-select"
                  id="eventType"
                  name="event_type"
                  required
                >
                  <option value="">Select Event</option>
                  <option value="Goal">Goal</option>
                  <option value="Assist">Assist</option>
                  <option value="Yellow Card">Yellow Card</option>
                  <option value="Red Card">Red Card</option>
                  <option value="Substitution">Substitution</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="minute" class="form-label">Minute</label>
                <input
                  type="number"
                  class="form-control"
                  id="minute"
                  name="minute"
                  min="1"
                  max="120"
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="addStatistic()"
            >
              Add Statistic
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const API_BASE = "http://localhost:8888/sports-league-app/backend/";

      function showPage(page) {
        console.log("Loading page:", page);

        if (page === "login") {
          document.getElementById("content").innerHTML = `
                    <h2 class="mb-4 login-title">Login</h2>
                    <div class="login-layout">
                        <div class="login-form">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email" id="loginEmail" required />
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" name="password" id="loginPassword" required />
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                            <div class="text-center mt-3">
                                <p class="mb-0">
                                    Don't have an account? 
                                    <a href="#" onclick="showPage('register')" class="text-decoration-none">Register here</a>
                                </p>
                            </div>
                        </div>
                    </div>
                `;
          setupLoginForm();
        } else if (page === "register") {
          document.getElementById("content").innerHTML = `
                    <h2 class="mb-4 register-title">Register</h2>
                    <div class="register-layout">
                        <div class="register-form">
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label for="regEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email" id="regEmail" required />
                                </div>
                                <div class="mb-3">
                                    <label for="regPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" name="password" id="regPassword" required />
                                </div>
                                <div class="mb-3">
                                    <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="regConfirmPassword" required />
                                </div>
                                <button type="submit" class="btn btn-success w-100">Sign Up</button>
                            </form>
                            <div class="text-center mt-3">
                                <p class="mb-0">
                                    Already have an account? 
                                    <a href="#" onclick="showPage('login')" class="text-decoration-none">Login here</a>
                                </p>
                            </div>
                        </div>
                    </div>
                `;
          setupRegisterForm();
        } else if (page === "teams") {
          loadTeamsPage();
        } else if (page === "matches") {
          loadMatchesPage();
        } else if (page === "statistics") {
          loadStatisticsPage();
        } else if (page === "profile") {
          loadProfilePage();
        } else {
          // Home page
          document.getElementById("content").innerHTML = `
                    <h1 class="mb-4 text-center">Welcome to Sports League</h1>
                    <div class="hero-bg p-5 mb-4 rounded-3">
                        <div class="container-fluid py-5">
                            <h2>Join the action now</h2>
                            <p>Track teams, matches, and player stats in real time.</p>
                            <a class="btn btn-primary" href="#" onclick="showPage('register')">Register</a>
                            <a class="btn btn-outline-dark" href="#" onclick="showPage('login')">Login</a>
                        </div>
                    </div>
                    <div class="container">
                        <div class="row home-cards-row">
                            <div class="col-lg-3">
                                <div class="card mb-4 shadow-sm home-card">
                                    <div class="card-body">
                                        <h5 class="card-title">Teams</h5>
                                        <p class="card-text">View and manage league teams.</p>
                                        <a href="#" class="btn btn-secondary" onclick="showPage('teams')">See Teams</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="card mb-4 shadow-sm home-card">
                                    <div class="card-body">
                                        <h5 class="card-title">Matches</h5>
                                        <p class="card-text">Check the latest fixtures and results.</p>
                                        <a href="#" class="btn btn-secondary" onclick="showPage('matches')">See Matches</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="card mb-4 shadow-sm home-card">
                                    <div class="card-body">
                                        <h5 class="card-title">Statistics</h5>
                                        <p class="card-text">View player and match statistics.</p>
                                        <a href="#" class="btn btn-secondary" onclick="showPage('statistics')">See Stats</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="card mb-4 shadow-sm home-card">
                                    <div class="card-body">
                                        <h5 class="card-title">Profile</h5>
                                        <p class="card-text">Manage your account settings.</p>
                                        <a href="#" class="btn btn-secondary" onclick="showPage('profile')">View Profile</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="text-center mt-4">
                            <h3>Ready to play?</h3>
                            <p>Register your team and compete in the ultimate sports league.</p>
                            <a class="btn btn-success" href="#" onclick="showPage('register')">Get Started</a>
                        </div>
                    </div>
                `;
        }
      }

      function setupRegisterForm() {
        setTimeout(() => {
          const form = document.getElementById("registerForm");
          if (form) {
            form.addEventListener("submit", function (e) {
              e.preventDefault();

              const formData = new FormData(e.target);
              const data = Object.fromEntries(formData.entries());
              const confirmPassword =
                document.getElementById("regConfirmPassword").value;

              if (data.password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
              }

              fetch(API_BASE + "api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
              })
                .then((response) => response.json())
                .then((result) => {
                  if (result.success) {
                    alert("Registration successful! Please login.");
                    showPage("login");
                  } else {
                    alert("Registration failed: " + result.message);
                  }
                })
                .catch((error) => {
                  alert("Registration failed: " + error.message);
                });
            });
          }
        }, 100);
      }

      function setupLoginForm() {
        setTimeout(() => {
          const form = document.getElementById("loginForm");
          if (form) {
            form.addEventListener("submit", function (e) {
              e.preventDefault();

              const formData = new FormData(e.target);
              const data = Object.fromEntries(formData.entries());

              fetch(API_BASE + "api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
              })
                .then((response) => response.json())
                .then((result) => {
                  if (result.success) {
                    // Store token in memory instead of localStorage
                    window.userToken = result.data.token;
                    alert("Login successful!");
                    updateNavigation();
                    showPage("home");
                  } else {
                    alert("Login failed: " + result.message);
                  }
                })
                .catch((error) => {
                  alert("Login failed: " + error.message);
                });
            });
          }
        }, 100);
      }

      function loadTeamsPage() {
        const token = window.userToken;
        if (!token) {
          alert("Please login first");
          showPage("login");
          return;
        }

        const user = parseJwt(token);
        const isAdmin = user?.user?.role === "admin";

        document.getElementById("content").innerHTML =
          '<div class="text-center"><div class="spinner-border" role="status"></div><p>Loading teams...</p></div>';

        fetch(API_BASE + "api/teams", {
          headers: { Authorization: "Bearer " + token },
        })
          .then((response) => response.json())
          .then((result) => {
            if (result.success) {
              let html = `
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="teams-title">Teams</h2>
                            ${
                              isAdmin
                                ? `<button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addTeamModal">
                                Add New Team
                            </button>`
                                : ""
                            }
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="table-responsive">
                                    <table class="table table-striped table-bordered teams-table">
                                        <thead>
                                            <tr>
                                                <th>Team Name</th>
                                                <th>City</th>
                                                <th>Coach</th>
                                                ${
                                                  isAdmin
                                                    ? "<th>Actions</th>"
                                                    : ""
                                                }
                                            </tr>
                                        </thead>
                                        <tbody>
                    `;

              if (result.data.length > 0) {
                result.data.forEach((team) => {
                  html += `
                                <tr>
                                    <td>${team.team_name}</td>
                                    <td>${team.city || "N/A"}</td>
                                    <td>${team.coach_name || "No Coach"}</td>
                                    ${
                                      isAdmin
                                        ? `<td>
                                        <button class="btn btn-sm btn-primary" onclick="viewTeamPlayers(${team.team_id})">
                                            View Players
                                        </button>
                                        <button class="btn btn-sm btn-success" onclick="addPlayerToTeam(${team.team_id})" data-bs-toggle="modal" data-bs-target="#addPlayerModal">
                                            Add Player
                                        </button>
                                    </td>`
                                        : ""
                                    }
                                </tr>
                            `;
                });
              } else {
                const colspan = isAdmin ? "4" : "3";
                html += `<tr><td colspan="${colspan}" class="text-center">No teams found</td></tr>`;
              }

              html += "</tbody></table></div></div></div>";
              document.getElementById("content").innerHTML = html;
            } else {
              alert("Error loading teams: " + result.message);
              showPage("home");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("Error loading teams. Please try again.");
            showPage("login");
          });
      }

      function loadMatchesPage() {
        const token = window.userToken;
        if (!token) {
          alert("Please login first");
          showPage("login");
          return;
        }

        const user = parseJwt(token);
        const isAdmin = user?.user?.role === "admin";

        document.getElementById("content").innerHTML =
          '<div class="text-center"><div class="spinner-border" role="status"></div><p>Loading matches...</p></div>';

        fetch(API_BASE + "api/matches", {
          headers: { Authorization: "Bearer " + token },
        })
          .then((response) => response.json())
          .then((result) => {
            if (result.success) {
              let html = `
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2>Matches</h2>
                            ${
                              isAdmin
                                ? `<button class="btn btn-success" onclick="loadTeamsForMatch()" data-bs-toggle="modal" data-bs-target="#addMatchModal">
                                Add New Match
                            </button>`
                                : ""
                            }
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <p>Upcoming and recent matches:</p>
                                <div class="table-responsive">
                                    <table class="table table-bordered matches-table">
                                        <thead>
                                            <tr>
                                                <th>Date</th>
                                                <th>Home Team</th>
                                                <th>Away Team</th>
                                                <th>Score</th>
                                                ${
                                                  isAdmin
                                                    ? "<th>Actions</th>"
                                                    : ""
                                                }
                                            </tr>
                                        </thead>
                                        <tbody>
                    `;

              if (result.data.length > 0) {
                result.data.forEach((match) => {
                  html += `
                                <tr>
                                    <td>${match.date_played || "TBD"}</td>
                                    <td>${match.home_team_name}</td>
                                    <td>${match.away_team_name}</td>
                                    <td>${
                                      match.score_home !== null &&
                                      match.score_away !== null
                                        ? match.score_home +
                                          " - " +
                                          match.score_away
                                        : "TBD"
                                    }</td>
                                    ${
                                      isAdmin
                                        ? `<td>
                                        <button class="btn btn-sm btn-primary" onclick="viewMatchStats(${match.match_id})">
                                            View Stats
                                        </button>
                                        <button class="btn btn-sm btn-success" onclick="addStatToMatch(${match.match_id})" data-bs-toggle="modal" data-bs-target="#addStatModal">
                                            Add Stats
                                        </button>
                                    </td>`
                                        : ""
                                    }
                                </tr>
                            `;
                });
              } else {
                const colspan = isAdmin ? "5" : "4";
                html += `<tr><td colspan="${colspan}" class="text-center">No matches found</td></tr>`;
              }

              html += "</tbody></table></div></div></div>";
              document.getElementById("content").innerHTML = html;
            } else {
              alert("Error loading matches: " + result.message);
              showPage("home");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("Error loading matches. Please try again.");
            showPage("login");
          });
      }

      function loadStatisticsPage() {

      function getEventBadgeClass(eventType) {

            return "bg-warning";
          case "Red Card":
            return "bg-danger";
          case "Substitution":
            return "bg-info";
          default:
            return "bg-secondary";
        }

      function parseJwt(token) {
        if (!token) return null;
        try {
          const payload = token.split(".")[1];
          const decoded = atob(payload);
          return JSON.parse(decoded);
        } catch (e) {
          return null;
        }
      }
