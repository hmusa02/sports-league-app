<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports League</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/register.css" />
    <link rel="stylesheet" href="css/teams.css" />
    <link rel="stylesheet" href="css/matches.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/statistics.css" />
    <link rel="stylesheet" href="css/players.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#" onclick="loadPage('home')"
          >Sports League</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="loadPage('home')">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="loadPage('matches')"
                >Matches</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="loadPage('teams')">Teams</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="loadPage('players')"
                >Players</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="loadPage('statistics')"
                >Statistics</a
              >
            </li>
          </ul>
          <div class="d-flex" id="authButtons">
            <button
              class="btn btn-outline-light me-2"
              onclick="loadPage('login')"
            >
              Login
            </button>
            <button class="btn btn-light" onclick="loadPage('register')">
              Register
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="container my-4 flex-fill">
      <div id="mainContent">
        <!-- Content will be loaded here -->
      </div>
    </div>

    <footer class="bg-success text-white text-center py-3 mt-auto w-100">
      <small>© 2025 Sports League</small>
    </footer>

    <!-- Modals -->
    <!-- Add Team Modal -->
    <div class="modal fade" id="addTeamModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add New Team</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addTeamForm">
              <div class="mb-3">
                <label for="teamName" class="form-label">Team Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="teamName"
                  name="team_name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="teamCity" class="form-label">City</label>
                <input
                  type="text"
                  class="form-control"
                  id="teamCity"
                  name="city"
                />
              </div>
              <div class="mb-3">
                <label for="coachName" class="form-label">Coach Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="coachName"
                  name="coach_name"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-success" onclick="addTeam()">
              Add Team
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Player Modal -->
    <div class="modal fade" id="addPlayerModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add New Player</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addPlayerForm">
              <div class="mb-3">
                <label for="playerFirstName" class="form-label"
                  >First Name</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="playerFirstName"
                  name="first_name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="playerLastName" class="form-label">Last Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="playerLastName"
                  name="last_name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="playerPosition" class="form-label">Position</label>
                <input
                  type="text"
                  class="form-control"
                  id="playerPosition"
                  name="position"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="playerTeamSelect" class="form-label">Team</label>
                <select
                  class="form-select"
                  id="playerTeamSelect"
                  name="team_id"
                >
                  <option value="">Select Team</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-success" onclick="addPlayer()">
              Add Player
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Statistics Modal -->
    <div class="modal fade" id="addStatModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Match Statistics</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addStatForm">
              <div class="mb-3">
                <label for="statMatchSelect" class="form-label">Match</label>
                <select
                  class="form-select"
                  id="statMatchSelect"
                  name="match_id"
                  required
                >
                  <option value="">Select Match</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="statPlayerSelect" class="form-label">Player</label>
                <select
                  class="form-select"
                  id="statPlayerSelect"
                  name="player_id"
                  required
                >
                  <option value="">Select Player</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="eventType" class="form-label">Event Type</label>
                <select
                  class="form-select"
                  id="eventType"
                  name="event_type"
                  required
                >
                  <option value="">Select Event</option>
                  <option value="goal">Goal</option>
                  <option value="assist">Assist</option>
                  <option value="yellow_card">Yellow Card</option>
                  <option value="red_card">Red Card</option>
                  <option value="substitution">Substitution</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="minute" class="form-label">Minute</label>
                <input
                  type="number"
                  class="form-control"
                  id="minute"
                  name="minute"
                  min="1"
                  max="120"
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="addStatistic()"
            >
              Add Statistic
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Statistics Modal -->
    <div class="modal fade" id="editStatModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Match Statistics</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="editStatForm">
              <div class="mb-3">
                <label for="editStatMatchSelect" class="form-label"
                  >Match</label
                >
                <select
                  class="form-select"
                  id="editStatMatchSelect"
                  name="match_id"
                  required
                >
                  <option value="">Select Match</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="editStatPlayerSelect" class="form-label"
                  >Player</label
                >
                <select
                  class="form-select"
                  id="editStatPlayerSelect"
                  name="player_id"
                  required
                >
                  <option value="">Select Player</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="editEventType" class="form-label">Event Type</label>
                <select
                  class="form-select"
                  id="editEventType"
                  name="event_type"
                  required
                >
                  <option value="">Select Event</option>
                  <option value="goal">Goal</option>
                  <option value="assist">Assist</option>
                  <option value="yellow_card">Yellow Card</option>
                  <option value="red_card">Red Card</option>
                  <option value="substitution">Substitution</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="editMinute" class="form-label">Minute</label>
                <input
                  type="number"
                  class="form-control"
                  id="editMinute"
                  name="minute"
                  min="1"
                  max="120"
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="updateStatistic()"
            >
              Update Statistic
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Player Statistics Modal -->
    <div class="modal fade" id="playerStatsModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Player Statistics</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Statistics will be loaded here -->
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Player Modal -->
    <div class="modal fade" id="editPlayerModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Player</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="editPlayerForm">
              <div class="mb-3">
                <label for="editPlayerFirstName" class="form-label"
                  >First Name</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="editPlayerFirstName"
                  name="first_name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editPlayerLastName" class="form-label"
                  >Last Name</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="editPlayerLastName"
                  name="last_name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editPlayerPosition" class="form-label"
                  >Position</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="editPlayerPosition"
                  name="position"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editPlayerTeamSelect" class="form-label"
                  >Team</label
                >
                <select
                  class="form-select"
                  id="editPlayerTeamSelect"
                  name="team_id"
                >
                  <option value="">Select Team</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="updatePlayer()"
            >
              Update Player
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap and other scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- MVC Services -->
    <script src="js/services/APIService.js"></script>
    <script src="js/services/AuthService.js"></script>
    <script src="js/services/ValidationService.js"></script>
    <script src="js/services/StatisticsService.js"></script>

    <!-- MVC Controllers -->
    <script src="js/controllers/StatisticsController.js"></script>

    <!-- App scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/teams.js"></script>
    <script src="js/matches.js"></script>
    <script src="js/statistics.js"></script>
    <script src="js/players.js"></script>
    <script src="js/app.js"></script>

    <script>
      // Initialize the app
      document.addEventListener("DOMContentLoaded", function () {
        // Load home page by default
        loadPage("home");
      });
    </script>
  </body>
</html>
